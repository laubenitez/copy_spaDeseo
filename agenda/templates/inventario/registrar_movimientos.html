{% extends "dashboard.html" %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-6">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
            <svg class="w-7 h-7 text-pink-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
            </svg>
            Registrar Movimiento de Inventario
        </h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">Controla las entradas por abastecimiento y salidas por uso o merma de materiales.</p>
    </div>

    <div class="bg-white dark:bg-darkCard rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm p-6 sm:p-8">
        <form method="POST" class="space-y-5" onsubmit="return validarFormularioMovimiento();">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Producto *</label>
                <select name="producto" id="selectProducto" required class="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
                    <option value="" disabled selected>Selecciona un producto</option>
                    {% for p in productos %}
                    <option value="{{ p.id }}" data-stock="{{ p.cantidad }}">{{ p.nombre }} (Stock actual: {{ p.cantidad }})</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Tipo de Movimiento *</label>
                <select name="tipo" id="selectTipo" required class="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
                    <option value="Entrada">Entrada (Compra / Abastecimiento)</option>
                    <option value="Salida">Salida (Uso en servicio / Merma)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Cantidad *</label>
                <input type="number" name="cantidad" id="inputCantidad" min="1" required class="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500" placeholder="Ej: 5">
                <p id="errorStock" class="mt-1 text-xs text-red-500 hidden">La cantidad de salida supera el stock disponible.</p>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Motivo / Descripción *</label>
                <textarea name="motivo" rows="3" minlength="3" required class="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500" placeholder="Ej: Compra de nuevos esmaltes semipermanentes..."></textarea>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-800">
                <a href="{% url 'agenda:inventario' %}" class="px-4 py-2.5 rounded-xl text-xs font-semibold bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 transition">
                    Cancelar
                </a>
                <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-semibold bg-pink-500 text-white hover:bg-pink-600 transition shadow-xs">
                    Registrar Movimiento
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function validarFormularioMovimiento() {
        const selectProducto = document.getElementById('selectProducto');
        const selectTipo = document.getElementById('selectTipo');
        const inputCantidad = document.getElementById('inputCantidad');
        const errorStock = document.getElementById('errorStock');

        const selectedOption = selectProducto.options[selectProducto.selectedIndex];
        const stockActual = parseInt(selectedOption.getAttribute('data-stock')) || 0;
        const cantidadIngresada = parseInt(inputCantidad.value) || 0;

        if (selectTipo.value === 'Salida' && cantidadIngresada > stockActual) {
            errorStock.textContent = `No hay suficiente stock. Stock disponible: ${stockActual}`;
            errorStock.classList.remove('hidden');
            inputCantidad.focus();
            return false;
        }

        errorStock.classList.add('hidden');
        return true;
    }
</script>
{% endblock %}
