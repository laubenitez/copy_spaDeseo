{% extends "dashboard.html" %}

{% block content %}
<div class="w-full">
    <!-- Botón Alineado a la Esquina Superior Derecha -->
    <div class="flex justify-end pt-2 mb-0">
        <a href="{% url 'agenda:ver_inventario' %}"
           class="inline-flex items-center justify-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition shadow-sm">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Volver a Inventario
        </a>
    </div>

    <!-- Contenedor Centrado (max-w-xl) alineado en altura con el botón -->
    <div class="max-w-xl mx-auto !-mt-8 sm:!-mt-9">
        <!-- Título y Descripción perfectamente alineados con el borde del formulario -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
                Registrar Movimiento
            </h1>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                Controla las entradas por abastecimiento y salidas por uso o merma de materiales.
            </p>
        </div>

        <!-- Tarjeta del Formulario -->
        <div class="bg-white dark:bg-darkCard rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm p-6 sm:p-8">
            <form method="POST" class="space-y-5" onsubmit="return validarFormularioMovimiento();">
                {% csrf_token %}

                <!-- Selector de Producto -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Producto *</label>
                    <div class="relative">
                        <select name="producto" id="selectProducto" required class="w-full appearance-none rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 px-4 py-2.5 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 transition cursor-pointer">
                            <option value="" disabled selected>Selecciona un producto</option>
                            {% for p in productos %}
                            <option value="{{ p.id }}" data-stock="{{ p.cantidad }}">{{ p.nombre }} (Stock actual: {{ p.cantidad }})</option>
                            {% endfor %}
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Tipo de Movimiento -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Tipo de Movimiento *</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="relative flex items-center justify-center gap-2 p-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 cursor-pointer hover:bg-emerald-50/50 dark:hover:bg-emerald-950/20 transition group">
                            <input type="radio" name="tipo" value="Entrada" checked class="peer sr-only">
                            <div class="w-full text-center py-1 rounded-lg text-xs font-semibold text-gray-700 dark:text-gray-300 peer-checked:bg-emerald-500 peer-checked:text-white transition flex items-center justify-center gap-1.5">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 11l5-5m0 0l5 5m-5-5v12" />
                                </svg>
                                Entrada
                            </div>
                        </label>

                        <label class="relative flex items-center justify-center gap-2 p-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 cursor-pointer hover:bg-rose-50/50 dark:hover:bg-rose-950/20 transition group">
                            <input type="radio" name="tipo" value="Salida" class="peer sr-only">
                            <div class="w-full text-center py-1 rounded-lg text-xs font-semibold text-gray-700 dark:text-gray-300 peer-checked:bg-rose-500 peer-checked:text-white transition flex items-center justify-center gap-1.5">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 13l-5 5m0 0l-5-5m5 5V6" />
                                </svg>
                                Salida
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Cantidad -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Cantidad *</label>
                    <input type="number" name="cantidad" id="inputCantidad" min="1" required class="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 transition" placeholder="Ej: 5">
                    <p id="errorStock" class="mt-1.5 text-xs font-medium text-rose-500 hidden flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span>La cantidad de salida supera el stock disponible.</span>
                    </p>
                </div>

                <!-- Motivo / Descripción -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Motivo / Descripción *</label>
                    <textarea name="motivo" rows="3" minlength="3" required class="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 transition" placeholder="Ej: Compra de nuevos esmaltes o uso en servicio..."></textarea>
                </div>

                <!-- Botones del Formulario -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-800">
                    <a href="{% url 'agenda:ver_inventario' %}" class="px-4 py-2.5 rounded-xl text-xs font-semibold bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                        Cancelar
                    </a>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-semibold bg-pink-600 text-white hover:bg-pink-700 transition shadow-xs flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        Registrar Movimiento
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function obtenerTipoSeleccionado() {
        const radios = document.getElementsByName('tipo');
        for (let radio of radios) {
            if (radio.checked) return radio.value;
        }
        return 'Entrada';
    }

    function validarFormularioMovimiento() {
        const selectProducto = document.getElementById('selectProducto');
        const inputCantidad = document.getElementById('inputCantidad');
        const errorStock = document.getElementById('errorStock');
        const tipo = obtenerTipoSeleccionado();

        const selectedOption = selectProducto.options[selectProducto.selectedIndex];
        const stockActual = parseInt(selectedOption.getAttribute('data-stock')) || 0;
        const cantidadIngresada = parseInt(inputCantidad.value) || 0;

        if (tipo === 'Salida' && cantidadIngresada > stockActual) {
            errorStock.querySelector('span').textContent = `No hay suficiente stock. Disponible: ${stockActual}`;
            errorStock.classList.remove('hidden');
            inputCantidad.focus();
            return false;
        }

        errorStock.classList.add('hidden');
        return true;
    }
</script>
{% endblock %}
