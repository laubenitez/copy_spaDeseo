{% extends "login_base.html" %}

{% load static %}

{% block title %}
    Registro | Spa Deseo
{% endblock %}

{% block content %}

<div class="register-content">

    <!-- LOGO -->
    <img
        src="{% static 'img/logo-spa-deseo-fucsia.png' %}"
        alt="Spa Deseo"
        class="login-logo"
    >

    <h1>Crear cuenta</h1>

    <p class="subtitulo">
        Regístrate para disfrutar de Spa Deseo
    </p>


    <form method="POST">

        {% csrf_token %}

        <!-- NOMBRE Y APELLIDO -->
        <div class="form-row">

            <div class="form-group">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Tu nombre"
                    required
                    minlength="3"
                    maxlength="100"
                    pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]+"
                >

            </div>

            <div class="form-group">

                <label for="apellido">
                    Apellido
                </label>

                <input
                    type="text"
                    id="apellido"
                    name="apellido"
                    placeholder="Tu apellido"
                    required
                    minlength="3"
                    maxlength="100"
                    pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]+"
                >

            </div>

        </div>


        <!-- TELÉFONO -->
        <div class="form-group">

            <label for="telefono">
                Teléfono
            </label>

            <input
                type="tel"
                id="telefono"
                name="telefono"
                placeholder="3001234567"
                required
                minlength="10"
                maxlength="15"
                pattern="[0-9]+"
            >

        </div>


        <!-- CORREO -->
        <div class="form-group">

            <label for="email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="ejemplo@correo.com"
                required
                maxlength="100"
            >

        </div>


        <!-- CONTRASEÑA -->
        <div class="form-group">

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Crea una contraseña"
                required
                minlength="8"
                maxlength="20"
                pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).*"
            >

        </div>


        <!-- BOTÓN -->
        <button
            type="submit"
            class="btn-login"
        >
            Registrarse
        </button>

    </form>


    <!-- LOGIN -->
    <p class="registro">

        ¿Ya tienes una cuenta?

        <a href="{% url 'agenda:login' %}">
            Inicia sesión
        </a>

    </p>

</div>


<script>

const password = document.getElementById("password");

password.addEventListener("input", function () {

    const valor = password.value;

    document.getElementById("longitud")
        .classList.toggle(
            "valido",
            valor.length >= 8
        );

    document.getElementById("mayuscula")
        .classList.toggle(
            "valido",
            /[A-Z]/.test(valor)
        );

    document.getElementById("minuscula")
        .classList.toggle(
            "valido",
            /[a-z]/.test(valor)
        );

    document.getElementById("numero")
        .classList.toggle(
            "valido",
            /\d/.test(valor)
        );

});

</script>


<style>

.register-content {
    width: 100%;
}


/* NOMBRE Y APELLIDO */

.form-row {
    display: flex;
    gap: 12px;
}

.form-row .form-group {
    flex: 1;
}


/* CAMPOS */

.register-content .form-group {
    text-align: left;
    margin-bottom: 15px;
}

.register-content label {
    display: block;
    margin-bottom: 6px;

    font-size: 13px;
    font-weight: 600;

    color: #b82d63;
}

.register-content input {
    width: 100%;
    height: 45px;

    padding: 0 13px;

    border: 1px solid #f2b3ca;
    border-radius: 10px;

    background: rgba(255, 255, 255, 0.8);

    color: #6d4657;

    font-size: 13px;

    outline: none;

    transition: 0.3s;
}

.register-content input:focus {

    border-color: #ef3f7c;

    box-shadow:
        0 0 0 3px rgba(239, 63, 124, 0.12);

    background: white;
}

.register-content input::placeholder {
    color: #b99aa9;
}


/* CONTRASEÑA */

.password-help {

    margin-top: 8px;

    padding: 10px;

    border-radius: 9px;

    background: #fff0f6;
}

.password-help p {

    margin: 3px 0;

    font-size: 11px;

    color: #b99aa9;

    transition: 0.2s;
}

.password-help p.valido {

    color: #e91e63;

    font-weight: bold;
}


/* RESPONSIVE */

@media (max-width: 500px) {

    .form-row {
        flex-direction: column;
        gap: 0;
    }

}

</style>

{% endblock %}
