
{% extends "login_base.html" %}
{% load static %}

{% block title %}Verificación de seguridad | Spa Deseo{% endblock %}

{% block content %}

<div class="verificacion-container">

    <img src="{% static 'img/logo-spa-deseo-fucsia.png' %}"
         alt="Spa Deseo" class="login-logo">

    <h1>Verificación de seguridad</h1>

    <p class="subtitulo">
        Introduce el código de confirmación para continuar.
    </p>

    <form method="POST" action="{% url 'agenda:verificar_codigo' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="codigo">Código de seguridad</label>

            <div class="input-wrapper">
                <span><i class="fa-solid fa-shield-halved"></i></span>
                <input
                    type="text"
                    id="codigo"
                    name="codigo"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    maxlength="6"
                    placeholder="Ingresa los 6 dígitos"
                    autocomplete="one-time-code"
                    required
                    autofocus
                >
            </div>
        </div>

        <button type="submit" class="btn-login">
            Verificar y continuar
        </button>
    </form>

    <div class="registro">
        ¿No deseas continuar?
        <a href="{% url 'agenda:login' %}">Inicia sesión</a>
    </div>

</div>

<style>
.verificacion-container {
    width: 100%;
    text-align: center;
}

.verificacion-container .login-logo {
    display: block;
    width: 175px;
    max-width: 70%;
    height: auto;
    margin: 0 auto 22px;
}

.verificacion-container h1 {
    color: #e52e70;
    font-size: 27px;
    line-height: 1.2;
    margin: 0 0 8px;
}

.verificacion-container .subtitulo {
    color: #956d80;
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 25px;
}

.verificacion-container .form-group {
    text-align: left;
    margin-bottom: 25px;
}

.verificacion-container label {
    display: block;
    color: #c62966;
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 6px;
}

.verificacion-container .input-wrapper {
    position: relative;
}

.verificacion-container .input-wrapper span {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #ef3f7c;
}

.verificacion-container input {
    width: 100%;
    height: 53px;
    box-sizing: border-box;
    padding: 12px 15px 12px 45px;
    border: 1px solid #f5b5ce;
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.8);
    color: #75475d;
    font-size: 16px;
    letter-spacing: 1px;
    text-align: center;
    outline: none;
}

.verificacion-container input:focus {
    border-color: #ef3f7c;
    box-shadow: 0 0 0 3px rgba(239, 63, 124, 0.12);
}

.verificacion-container .btn-login {
    width: 100%;
    min-height: 53px;
    border: none;
    border-radius: 13px;
    background: #ef3f7c;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(239, 63, 124, 0.2);
    transition: background 0.3s;
}

.verificacion-container .btn-login:hover {
    background: #d82b68;
}

.verificacion-container .registro {
    margin-top: 23px;
    color: #956d80;
    font-size: 14px;
    line-height: 1.7;
}

.verificacion-container .registro a {
    color: #e52e70;
    font-weight: bold;
    text-decoration: none;
}

.verificacion-container .registro a:hover {
    text-decoration: underline;
}

@media (max-width: 500px) {
    .verificacion-container .login-logo {
        width: 150px;
    }

    .verificacion-container h1 {
        font-size: 24px;
    }

    .verificacion-container .subtitulo {
        font-size: 13px;
    }
}
</style>

{% endblock %}
