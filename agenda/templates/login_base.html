{% load static %}


<!DOCTYPE html>
<html lang="es">


<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
   <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'img/site.webmanifest' %}">


   <title>{% block title %}Spa Deseo{% endblock %}</title>


   <style>
       * {
           box-sizing: border-box;
           margin: 0;
           padding: 0;
       }


       body {
           min-height: 100vh;
           font-family: Arial, Helvetica, sans-serif;
           display: flex;
           justify-content: center;
           align-items: center;
           position: relative;
           overflow: hidden;
           /* Fondo rosado pastel */
           background: linear-gradient(
               135deg,
               #ffdce9 0%,
               #ffc6da 45%,
               #ff9fbe 100%
           );
       }


       /* =========================
          MARCA DE AGUA
       ========================== */


       .watermark {
           position: absolute;
           width: 1000px;
           max-width: 100vw;
           top: 50%;
           left: 50%;
           transform: translate(-50%, -50%);
           opacity: 0.10;
           z-index: 0;
           pointer-events: none;
           filter: saturate(1.5);
       }


       /* =========================
          TARJETA
       ========================== */


       .login-container {
           position: relative;
           z-index: 2;
           width: 390px;
           max-width: 90%;
           padding: 40px;
           border-radius: 25px;
           background: rgba(255, 248, 251, 0.78);
           backdrop-filter: blur(14px);
           -webkit-backdrop-filter: blur(14px);
           border: 1px solid rgba(255, 255, 255, 0.75);
           box-shadow:
               0 20px 45px rgba(210, 40, 105, 0.20);
           text-align: center;
       }


       /* =========================
          LOGO PEQUEÑO
       ========================== */


       .login-logo {
           width: 150px;
           max-width: 100%;
           display: block;
           margin: 0 auto 12px;
       }


       /* =========================
          TITULO
       ========================== */


       h1 {
           color: #d92f70;
           font-size: 30px;
           margin-bottom: 2px;
       }


       .subtitulo {
           color: #8d6879;
           font-size: 14px;
           margin-bottom: 20px;
       }


       /* =========================
          MENSAJES
       ========================== */


       .mensaje {
           margin-bottom: 20px;
           padding: 12px;
           border-radius: 10px;
           background-color: #ffe4ef;
           color: #c52d66;
           font-size: 14px;
           border-left: 4px solid #f43f7f;
       }


       /* =========================
          CAMPOS
       ========================== */


       .form-group {
           text-align: left;
           margin-bottom: 18px;
       }


       .form-group label {
           display: block;
           margin-bottom: 7px;
           color: #b82d63;
           font-size: 14px;
           font-weight: 600;
       }


       .input-wrapper {
           position: relative;
       }


       .input-wrapper span {
           position: absolute;
           left: 15px;
           top: 50%;
           transform: translateY(-50%);
           color: #ef407c;
           font-size: 17px;
       }


       input {
           width: 100%;
           height: 48px;
           padding: 0 15px 0 45px;
           border: 1px solid #f2b3ca;
           border-radius: 12px;
           background: rgba(255, 255, 255, 0.80);
           color: #6d4657;
           font-size: 14px;
           outline: none;
           transition: 0.3s;
       }


       input::placeholder {
           color: #b99ca9;
       }


       input:focus {
           border-color: #ef3f7c;
           box-shadow:
               0 0 0 3px rgba(239, 63, 124, 0.12);
           background: white;
       }


       /* =========================
          BOTÓN
       ========================== */


       .btn-login {
           width: 100%;
           height: 48px;
           margin-top: 8px;
           border: none;
           border-radius: 12px;
           background: linear-gradient(
               135deg,
               #ff4f91,
               #e91e63
           );


           color: white;
           font-size: 15px;
           font-weight: bold;
           cursor: pointer;
           box-shadow:
               0 8px 18px rgba(233, 30, 99, 0.25);


           transition: 0.3s;
       }


       .btn-login:hover {
           transform: translateY(-2px);
           box-shadow:
               0 12px 25px rgba(233, 30, 99, 0.32);
       }


       /* =========================
          REGISTRO
       ========================== */


       .registro {
           margin-top: 22px;
           font-size: 14px;
           color: #795866;
       }


       a {
           color: #e91e63;
           font-weight: bold;
           text-decoration: none;
       }


       a:hover {
           text-decoration: underline;
       }
       

       /* ESTILOS PARA EL DIVISOR Y EL BOTÓN DE GOOGLE */
        /* DIVISOR CON LÍNEAS SEGUIDAS */
        .social-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 15px 0;
            color: #b99aa9;
            font-size: 11.5px;
            width: 100%;
        }

        /* Línea izquierda y línea derecha */
        .social-divider::before,
        .social-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #f2b3ca; /* Color de la línea (puedes ajustarlo) */
            margin: 0 10px; /* Espacio entre la línea y el texto central */
        }

        .social-divider span {
            padding: 0 5px;
            white-space: nowrap; /* Evita que el texto "o regístrate con" se baje de línea */
        }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 38px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: white;
            color: #6d4657;
            border: 1px solid #f2b3ca;
            font-weight: 600;
            font-size: 12.5px;
            text-decoration: none !important;; 
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-google i {
            color: #ef3f7c;
            font-size: 14px;
            text-decoration: none !important;;
        }

        .btn-google:hover {
            background: #fff8fb;
            border-color: #ef3f7c;
            box-shadow: 0 0 0 3px rgba(239, 63, 124, 0.08);
        }


       /* =========================
          RESPONSIVE
       ========================== */


       @media (max-width: 500px) {


           .login-container {
               padding: 30px 24px;
           }


           .watermark {
               width: 600px;
           }


           h1 {
               font-size: 26px;
           }
       }
   </style>
</head>


<body>


   <!-- MARCA DE AGUA DEL LOGO -->
   <img
       src="{% static 'img/logo-spa-deseo-fucsia.png' %}"
       alt=""
       class="watermark"
   >


   <!-- TARJETA -->
   <div class="login-container">


       {% if messages %}
           {% for message in messages %}
               <div class="mensaje">
                   {{ message }}
               </div>
           {% endfor %}
       {% endif %}


       {% block content %}
       {% endblock %}


   </div>


</body>


</html>
