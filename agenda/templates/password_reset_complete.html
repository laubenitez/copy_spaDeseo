{% extends "login_base.html" %}
{% load static %}

{% block title %}
    Contraseña actualizada | Spa Deseo
{% endblock %}

{% block content %}

<div class="register-content" style="text-align: center;">

    <img src="{% static 'img/logo-spa-deseo-fucsia.png' %}" alt="Spa Deseo" class="login-logo">

    <h1>¡Contraseña cambiada!</h1>

    <p class="subtitulo" style="margin-top: 10px;">
        Tu contraseña se ha actualizado correctamente. Ya puedes iniciar sesión con tu nueva clave.
    </p>

    <div style="margin-top: 25px;">
        <a href="{% url 'agenda:login' %}" class="btn-login" style="display: block; line-height: 42px; text-decoration: none;">
            Iniciar sesión
        </a>
    </div>

</div>

<style>
.register-content { width: 100%; }
.register-content h1 { font-size: 26px; color: #d92f70; margin-bottom: 2px; }
.subtitulo { font-size: 13px; color: #8d6879; }
.btn-login {
    width: 100%;
    height: 42px;
    border-radius: 10px;
    background: #ef3f7c;
    color: white;
    font-weight: bold;
    font-size: 13px;
    transition: 0.3s;
}
.btn-login:hover { background: #d82b68; }
</style>

{% endblock %}
